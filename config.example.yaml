# ~/.config/hugin/council.yaml
# Merged over ~/.config/hugin/hugin.yaml; values here win. Everything below is
# optional: the built-in defaults are the same rosters, so the tool runs with no
# council.yaml at all as long as hugin.yaml sets vault_path.

council:
  # Holds both secretary sessions and does the file work. Pick it up front and
  # do not swap it mid-council: continuity is the point.
  secretary: claude:claude-opus-5:high

  # Which roster `ask` uses when --roster is not given.
  roster: default

  # The secretary is not a member: opus keeps the sessions, the members do the
  # hard reasoning, so the two lists do not overlap.
  rosters:
    default:
      - claude:claude-fable-5-1:medium
      - codex:gpt-6-astra:medium
    # agy appears here and nowhere else: the quota is the scarce resource, so it
    # is spent only when breadth is asked for explicitly. Note that agy bakes the
    # reasoning level into the gemini model slug, so no third field is needed.
    wide:
      - claude:claude-fable-5-1:medium
      - codex:gpt-6-astra:medium
      - agy:gemini-3.8-flash-medium
    cheap:
      - claude:claude-haiku-4-5-20251001:medium
      - codex:gpt-5.4-mini:medium

  # Effort for phase 2b only, since folding answers together is lighter work
  # than producing them. Effort is part of the server-side prompt cache key
  # (measured 2026-08-25), so stepping down costs one re-read of the secretary's
  # conversation per council, not per round. Only fable-5-1 in Claude Code and
  # gpt-6-astra in codex (behind a flag) escape that as of 2026-09; opus-5 does
  # not yet. Empty means "whatever the secretary spec says".
  synthesis_effort: medium

  # State, not output: safe to wipe. The finished write-up belongs in the vault.
  state_dir: ~/.council

  # A cwd under here counts as a project repo, which makes that repo the subject
  # and brings the Hugin directories along as extra reading.
  projects_root: ~/projs

  # Always readable, wherever the command was run from. Defaults to vault_path.
  # hugin_dirs:
  #   - ~/notes

  # Seconds per turn. Members may go looking through the vault, so not short.
  turn_timeout: 1800

  # A turn that took at least this many seconds ends with a terminal bell and,
  # if notify-send and a desktop are there, a notification. Rounds take minutes
  # and you will have looked away. 0 turns it off.
  notify_after: 30

  # Override any packaged prompt with your own file.
  # synthesis_prompt_path: ~/notes/instructions/council_synthesis.md
  # critique_prompt_path: ~/notes/instructions/council_critique.md

  # The standing facts about YOUR machine, pasted into the secretary's gather and
  # serial prompts. Nothing is packaged and nothing is inferred, so without this
  # line there is no house block at all -- see "House rules" in the README for
  # what belongs in the file. The members never see it.
  # house_prompt_path: ~/notes/instructions/council_house.md
